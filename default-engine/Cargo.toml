[package]
name = "delta_kernel_default_engine"
description = "Default Arrow/Tokio-based engine implementation for delta_kernel."
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
version.workspace = true
rust-version.workspace = true

# for cargo-release
[package.metadata.release]
pre-release-replacements = [
  { file = "../README.md", search = "delta_kernel_default_engine = \\{ version = \"[a-z0-9\\.-]+\"", replace = "delta_kernel_default_engine = { version = \"{{version}}\"" },
]

[dependencies]
delta_kernel = { path = "../kernel", version = "0.29.0", features = [
  "default-engine-base",
  "internal-api",
] }
async-stream = "0.3"
async-trait = "0.1"
bytes = "1.10"
chrono = "0.4.41"
futures = "0.3"
itertools = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "query", "system-proxy"] }
serde_json = "1"
tracing = { version = "0.1", features = ["log"] }
url = "2"
uuid = { version = "1.18.0", features = ["v4"] }

# tokio is only used by the thread-based tokio executors and tests, neither of which exist on
# wasm32. Gating it to non-wasm targets keeps it (and its multi-thread runtime) out of wasm builds.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread"] }

# wasm-only dependencies for the JSPI-based executor: bridging `!Send` async-I/O futures into the
# engine's `Send`-bound handlers by driving them on the JS microtask queue (`wasm-bindgen-futures`)
# and blocking with JavaScript Promise Integration (`js-sys`).
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
default = ["arrow", "rustls", "cloud-stores"]
arrow = ["arrow-60"]
arrow-60 = ["delta_kernel/arrow-60"]
arrow-59 = ["delta_kernel/arrow-59"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
# Enables constructing aws/azure/gcp stores via parse_url_opts. On by default for native, but
# turned off for wasm32 targets (those object_store features pull in ring/aws-lc-rs, which do
# not build for wasm).
cloud-stores = ["delta_kernel/cloud-stores"]

[dev-dependencies]
delta_kernel_default_engine_test_utils = { path = "./test-utils" }
rstest = "0.23"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
test_utils = { path = "../test-utils", default-features = false }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
wiremock = "0.6"
hdfs_native_object_store_13 = { package = "hdfs-native-object-store", version = "0.16.0" }
hdfs_native_object_store_14 = { package = "hdfs-native-object-store", version = "0.17.0" }
